name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # VITE_* values are baked into the static bundle at build time, and
      # this build runs on GitHub's servers, not the VM — so these come
      # from repository variables (Settings > Secrets and variables >
      # Actions > Variables on this repo), not anything known here.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_CONTACT_NAME=${{ vars.VITE_CONTACT_NAME }}
            VITE_CONTACT_NUMBER=${{ vars.VITE_CONTACT_NUMBER }}
          tags: |
            ghcr.io/printbuddy/print-buddy-frontend:latest
            ghcr.io/printbuddy/print-buddy-frontend:${{ github.sha }}
