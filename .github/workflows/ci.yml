name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    needs: test
    runs-on: ubuntu-latest
    # Cancels out the workflow-level `defaults.run.working-directory: app`
    # above — this job's steps mostly run from infra/e2e or repo root, not
    # this repo's own app/ subdirectory.
    defaults:
      run:
        working-directory: .
    env:
      # Every docker compose invocation in this job re-validates the whole
      # compose file (image refs included), even when a step only touches
      # one service (e.g. seed.py's `exec postgres` calls, or the final
      # teardown) — so these need to be job-scoped, not just set on the
      # "Start the E2E stack" step.
      #
      # Both images are built fresh from each repo's current `main`, not
      # pulled from GHCR — pulling `:latest` raced the backend's own
      # build-and-push job (this e2e run could start and pull *before*
      # backend's new image finished publishing) and, worse, silently
      # tested against a stale backend whenever a feature spanned both
      # repos and backend hadn't merged yet (see print-buddy-infra's
      # README, "Cross-repo features"). Building from source removes both
      # failure modes at the cost of a slightly longer job.
      BACKEND_IMAGE: local-backend:e2e
      FRONTEND_IMAGE: local-frontend:e2e
    steps:
      - uses: actions/checkout@v4

      - name: Checkout print-buddy-infra (E2E stack + Playwright suite)
        uses: actions/checkout@v4
        with:
          repository: PrintBuddy/print-buddy-infra
          path: infra

      - name: Checkout backend (built fresh below, from its current main)
        uses: actions/checkout@v4
        with:
          repository: PrintBuddy/print-buddy
          path: backend-src

      - name: Build frontend image (this PR's code)
        # VITE_API_BASE_URL is baked in at build time — must point at the
        # backend's host-published port, since Playwright's browser runs
        # on this runner, not inside the compose network (see
        # infra/e2e/README.md).
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=http://localhost:8000/api \
            -t local-frontend:e2e \
            ./app

      - name: Build backend image (backend's current main)
        run: docker build -t local-backend:e2e ./backend-src

      - name: Start the E2E stack
        working-directory: infra/e2e
        run: |
          docker compose -f docker-compose.e2e.yml up -d --build

      - name: Wait for backend health
        # docker-entrypoint.sh already runs `alembic upgrade head` before
        # starting uvicorn, so a healthy response means migrations are
        # applied too — no separate migration step needed here.
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health >/dev/null; then
              echo "Backend is healthy."
              exit 0
            fi
            sleep 3
          done
          echo "Backend never became healthy." >&2
          exit 1

      - name: Seed test users, admin, and printer pricing
        working-directory: infra/e2e
        run: python3 seed.py

      - name: Install Playwright
        working-directory: infra/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: infra/e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: infra/e2e/playwright-report/
          retention-days: 7

      - name: Tear down the E2E stack
        if: always()
        working-directory: infra/e2e
        run: docker compose -f docker-compose.e2e.yml down -v

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # VITE_* values are baked into the static bundle at build time, and
      # this build runs on GitHub's servers, not the VM — so these come
      # from repository variables (Settings > Secrets and variables >
      # Actions > Variables on this repo), not anything known here.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_CONTACT_NAME=${{ vars.VITE_CONTACT_NAME }}
            VITE_CONTACT_NUMBER=${{ vars.VITE_CONTACT_NUMBER }}
          tags: |
            ghcr.io/printbuddy/print-buddy-frontend:latest
            ghcr.io/printbuddy/print-buddy-frontend:${{ github.sha }}
